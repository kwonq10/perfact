<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>ページが見つかりません｜スキマ</title>
  <meta name="theme-color" content="#4f8ef7">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      color: #1a1a2e;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      padding: 40px 28px;
      text-align: center;
    }

    .icon {
      width: 64px;
      height: 64px;
      border-radius: 12px;
      display: block;
      margin: 0 auto 24px;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      color: #1a1a2e;
      margin-bottom: 14px;
      line-height: 1.5;
    }

    p {
      font-size: 14px;
      color: #555;
      line-height: 1.8;
      margin-bottom: 28px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      background: #4f8ef7;
      color: white;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
    }

    .btn:hover { background: #3a7de8; }
    .btn:active { background: #3a7de8; }

    @media (max-width: 380px) {
      .card { padding: 32px 20px; }
      h1 { font-size: 18px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <img src="/icon-192.png" alt="" class="icon" width="64" height="64">
    <h1>ページが見つかりません</h1>
    <p>URLが変更されたか、ページが削除された可能性があります。</p>
    <a href="/" class="btn">スキマに戻る</a>
  </main>
</body>
</html>
